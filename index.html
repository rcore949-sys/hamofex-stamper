<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>HAMOFEX Stamper</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --ink:#1a1d29; --muted:#6b7280;
    --accent:#1e3fd6; --accent-hover:#1633ad; --border:#e2e4ea; --danger:#e5484d;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1115; --panel:#17191f; --ink:#f1f2f5; --muted:#9aa0ac;
      --accent:#5b7cff; --accent-hover:#7691ff; --border:#2a2e38;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1115; --panel:#17191f; --ink:#f1f2f5; --muted:#9aa0ac;
    --accent:#5b7cff; --accent-hover:#7691ff; --border:#2a2e38;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overscroll-behavior:none; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column;
    height:100dvh;
    width:100vw;
    overflow:hidden;
    touch-action:manipulation;
  }
  button{ font-family:inherit; touch-action:manipulation; }

  header{
    flex:0 0 auto;
    padding:calc(var(--safe-t) + 10px) 16px 10px;
    background:var(--panel); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  header h1{ font-size:16px; margin:0; font-weight:700; letter-spacing:-.2px; }
  header h1 span{ color:var(--accent); }
  header .sub{ color:var(--muted); font-size:11.5px; margin-top:1px; }
  .icon-btn{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--border);
    background:var(--panel); display:flex; align-items:center; justify-content:center;
    font-size:17px; color:var(--ink); flex:0 0 auto;
  }
  .icon-btn:active{ background:var(--border); }
  .icon-btn:disabled{ opacity:.35; }

  main{
    flex:1 1 auto; min-height:0; position:relative;
    display:flex; flex-direction:column;
  }
  .viewer-wrap{
    flex:1; min-height:0; overflow:auto; -webkit-overflow-scrolling:touch;
    display:flex; justify-content:center; align-items:flex-start;
    padding:14px 10px 24px;
    background:var(--bg);
  }
  .zoom-sizer{ position:relative; flex:0 0 auto; touch-action:none; }
  .page-stage{
    position:relative; background:#fff; box-shadow:0 2px 16px rgba(0,0,0,.16);
    touch-action:none;
  }
  .page-stage canvas{ display:block; width:100%; height:100%; }
  .zoom-hint{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.55); color:#fff; font-size:11px; padding:4px 10px; border-radius:20px;
    pointer-events:none; opacity:0; transition:opacity .3s ease; z-index:5; white-space:nowrap;
  }
  .zoom-hint.show{ opacity:1; }

  .empty-state{
    margin:auto; text-align:center; color:var(--muted); padding:20px;
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .empty-state .big{ font-size:56px; line-height:1; }
  .empty-state p{ margin:0; font-size:15px; max-width:260px; }
  .cta-btn{
    background:var(--accent); color:#fff; border:none; border-radius:14px;
    padding:16px 28px; font-size:16.5px; font-weight:700;
    box-shadow:0 4px 14px rgba(30,63,214,.3);
  }
  .cta-btn:active{ background:var(--accent-hover); transform:scale(.98); }

  input[type=file]{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  .stamp-el{
    position:absolute; cursor:grab; user-select:none; touch-action:none;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.18));
  }
  .stamp-el img{ width:100%; height:100%; display:block; pointer-events:none; }
  .stamp-el .hit{
    position:absolute; width:40px; height:40px; display:flex; align-items:center; justify-content:center;
  }
  .stamp-el .hit .dot{
    width:16px; height:16px; border-radius:5px; background:var(--accent); border:2.5px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,.35);
  }
  .stamp-el .hit-e, .stamp-el .hit-w{ top:50%; transform:translateY(-50%); cursor:ew-resize; }
  .stamp-el .hit-e{ right:-20px; } .stamp-el .hit-w{ left:-20px; }
  .stamp-el .hit-n, .stamp-el .hit-s{ left:50%; transform:translateX(-50%); cursor:ns-resize; }
  .stamp-el .hit-n{ top:-20px; } .stamp-el .hit-s{ bottom:-20px; }
  .stamp-el .hit-n .dot, .stamp-el .hit-s .dot{ width:20px; height:10px; }
  .stamp-el .hit-e .dot, .stamp-el .hit-w .dot{ width:10px; height:20px; }
  .stamp-el .del{
    position:absolute; left:-20px; top:-20px; width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;
  }
  .stamp-el .del .x{
    width:22px; height:22px; border-radius:50%; background:var(--danger); color:#fff;
    border:2.5px solid #fff; font-size:13px; line-height:18px; text-align:center; font-weight:700;
    box-shadow:0 1px 4px rgba(0,0,0,.35);
  }
  .stamp-el.selected{ outline:2px dashed var(--accent); outline-offset:2px; }
  .stamp-el .hit, .stamp-el .del{ display:none; }
  .stamp-el.selected .hit, .stamp-el.selected .del{ display:flex; }
  .stamp-el:not(.selected){ cursor:default; }
  .stamp-el.selected{ cursor:grab; }

  .dock{
    flex:0 0 auto; background:var(--panel); border-top:1px solid var(--border);
    padding-bottom:calc(var(--safe-b) + 8px);
  }
  .date-row{
    display:none; align-items:center; gap:8px; padding:10px 12px 0;
  }
  .date-row label{ font-size:12px; color:var(--muted); flex:0 0 auto; }
  .date-row input[type=date]{
    flex:1; min-width:0; font-size:14px; padding:8px 10px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg); color:var(--ink); font-family:inherit;
  }
  .date-row button{
    flex:0 0 auto; background:var(--panel); border:1.5px solid var(--border); color:var(--accent);
    font-weight:700; font-size:12.5px; padding:8px 12px; border-radius:10px;
  }
  .date-row button:active{ background:var(--border); }
  .gallery-row{
    display:flex; gap:10px; padding:10px 12px 6px; overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  .gallery-row::-webkit-scrollbar{ display:none; }
  .stamp-thumb{
    flex:0 0 auto; width:58px; height:58px; border-radius:12px; border:2px solid var(--border);
    background: repeating-conic-gradient(#00000008 0% 25%, transparent 0% 50%) 50% / 10px 10px;
    display:flex; align-items:center; justify-content:center; padding:6px; position:relative;
  }
  .stamp-thumb img{ max-width:100%; max-height:100%; }
  .stamp-thumb.active{ border-color:var(--accent); }
  .stamp-thumb.active::after{
    content:''; position:absolute; inset:-2px; border-radius:12px; border:2px solid var(--accent); opacity:.5;
  }

  .action-row{
    display:flex; align-items:center; gap:10px; padding:6px 12px 4px;
  }
  .action-row .pages-nav{
    display:flex; align-items:center; gap:4px; flex:0 0 auto;
  }
  .action-row .pages-nav span{
    font-size:12px; color:var(--muted); min-width:44px; text-align:center;
  }
  .primary-btn{
    flex:1; background:var(--accent); color:#fff; border:none; border-radius:12px;
    padding:14px 10px; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .primary-btn:active{ background:var(--accent-hover); }
  .primary-btn:disabled{ background:#9aa0ac; opacity:.5; }
  .ghost-btn{
    flex:0 0 auto; background:transparent; border:1.5px solid var(--border); color:var(--ink);
    border-radius:12px; padding:14px 14px; font-size:14px; font-weight:600;
  }
  .ghost-btn:disabled{ opacity:.35; }
  .ghost-btn.active{
    background:var(--accent); border-color:var(--accent); color:#fff;
  }

  .draw-overlay{
    position:absolute; inset:0; width:100%; height:100%;
    z-index:15; cursor:crosshair; touch-action:none;
  }

  @keyframes shimmerSweep{
    0%{ background-position: -150% 0; }
    100%{ background-position: 250% 0; }
  }
  @keyframes sparkleTwinkle{
    0%,100%{ opacity:0; transform:scale(.4) rotate(0deg); }
    50%{ opacity:1; transform:scale(1.15) rotate(25deg); }
  }
  @keyframes glitterPulse{
    0%,100%{ box-shadow:0 0 0px 0px rgba(91,124,255,.5); }
    50%{ box-shadow:0 0 18px 6px rgba(91,124,255,.55); }
  }
  .glitter-overlay{
    position:absolute; pointer-events:none; z-index:25; border-radius:8px;
    border:2px solid rgba(91,124,255,.85);
    background: linear-gradient(120deg, rgba(91,124,255,0) 20%, rgba(150,180,255,.55) 45%, rgba(255,255,255,.9) 50%, rgba(150,180,255,.55) 55%, rgba(91,124,255,0) 80%);
    background-size:250% 100%;
    animation: shimmerSweep 1.1s linear infinite, glitterPulse 1.6s ease-in-out infinite;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .glitter-overlay .sparkle{
    position:absolute; pointer-events:none; animation:sparkleTwinkle 1.1s ease-in-out infinite;
    filter:drop-shadow(0 0 3px rgba(255,255,255,.9));
  }
  .glitter-overlay .glitter-pct{
    position:relative; background:rgba(20,24,40,.75); color:#fff; font-weight:800; font-size:15px;
    padding:6px 14px; border-radius:20px; letter-spacing:.3px; box-shadow:0 2px 10px rgba(0,0,0,.25);
    white-space:nowrap;
  }

  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.32); opacity:0; pointer-events:none;
    transition:opacity .2s ease; z-index:40;
  }
  .sheet-backdrop.open{ opacity:1; pointer-events:auto; }
  .edit-sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    background:var(--panel); border-radius:20px 20px 0 0;
    padding:14px 18px calc(var(--safe-b) + 16px);
    transform:translateY(110%); transition:transform .22s cubic-bezier(.32,.72,0,1);
    box-shadow:0 -6px 24px rgba(0,0,0,.18);
    max-height:70vh; overflow-y:auto;
  }
  .edit-sheet.open{ transform:translateY(0); }
  .sheet-handle{
    width:36px; height:4px; border-radius:3px; background:var(--border); margin:0 auto 12px;
  }
  .sheet-title{
    font-size:14px; font-weight:700; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;
  }
  .sheet-title button{
    background:none; border:none; color:var(--danger); font-size:13.5px; font-weight:700; padding:6px;
  }
  .field{ margin-bottom:18px; }
  .field label{ font-size:13px; color:var(--muted); display:flex; justify-content:space-between; margin-bottom:8px; }
  .field label b{ color:var(--ink); font-weight:600; }
  .field input[type=range]{ width:100%; height:32px; accent-color:var(--accent); }
  .field input[type=date]{
    width:100%; font-size:15px; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg); color:var(--ink); font-family:inherit;
  }
  .sheet-done{
    width:100%; background:var(--accent); color:#fff; border:none; border-radius:12px;
    padding:14px; font-size:15px; font-weight:700; margin-top:4px;
  }
  .autosign-btn{
    width:100%; background:var(--panel); border:1.5px solid var(--accent); color:var(--accent);
    border-radius:12px; padding:12px; font-size:14.5px; font-weight:700;
  }
  .autosign-btn:active{ background:var(--border); }
  .autosign-btn.is-signed{
    background:var(--accent); color:#fff; border-color:var(--accent);
  }

  .toast{
    position:fixed; bottom:calc(var(--safe-b) + 90px); left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:10px; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:50; white-space:nowrap;
  }
  .toast.show{ opacity:.95; }

  .load-banner{
    position:fixed; left:12px; right:12px; z-index:60;
    top:calc(var(--safe-t) + 8px);
    background:#3a1212; color:#ffd7d7; border:1px solid #7a2a2a;
    border-radius:12px; padding:10px 14px; font-size:12.5px; line-height:1.4;
    display:none;
  }
  .load-banner.show{ display:block; }

  #appRoot{ display:flex; flex-direction:column; flex:1 1 auto; min-height:0; width:100%; height:100%; }
  #appRoot.hidden{ display:none !important; }

  #lockScreen{
    position:fixed; inset:0; z-index:999; background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    padding:calc(var(--safe-t) + 24px) calc(var(--safe-r) + 24px) calc(var(--safe-b) + 24px) calc(var(--safe-l) + 24px);
  }
  #lockScreen.hidden{ display:none !important; }
  .lock-box{ width:100%; max-width:280px; display:flex; flex-direction:column; gap:12px; }
  .lock-box input{
    width:100%; font-size:16px; padding:14px 16px; border-radius:12px;
    border:1px solid var(--border); background:var(--panel); color:var(--ink);
    font-family:inherit; text-align:center;
  }
  .lock-box input:focus{ outline:none; border-color:var(--accent); }
  .lock-box button{
    width:100%; background:var(--accent); color:#fff; border:none; border-radius:12px;
    padding:14px; font-size:15px; font-weight:700;
  }
  .lock-box button:active{ background:var(--accent-hover); }
  .lock-box button:disabled{ background:#9aa0ac; opacity:.6; }
  .lock-box .lock-msg{ min-height:16px; font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>
<body>

<div id="lockScreen">
  <form id="lockForm" class="lock-box" autocomplete="off">
    <input type="text" id="lockInput" name="f1" autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text">
    <button type="submit" id="lockSubmit">Continue</button>
    <div class="lock-msg" id="lockMsg"></div>
  </form>
</div>

<div id="appRoot" class="hidden">

<header>
  <div>
    <h1>HAMOFEX <span>Stamper</span></h1>
    <div class="sub" id="statusText">Tap below to open a PDF</div>
  </div>
  <label class="icon-btn" for="pdfInput" title="Open PDF">📄</label>
  <input type="file" id="pdfInput" accept="application/pdf,.pdf">
</header>

<div class="load-banner" id="loadBanner"></div>

<main>
  <div class="viewer-wrap" id="viewerWrap">
    <div class="empty-state" id="emptyState">
      <div class="big">🪧</div>
      <p>Open a PDF, pick a stamp below, then tap to place it. Pinch to zoom in for precise placement.</p>
      <label class="cta-btn" for="pdfInput">Open PDF</label>
    </div>
  </div>
</main>

<div class="dock">
  <div class="date-row" id="dateRow">
    <label for="stampDateInput">Stamp date</label>
    <input type="date" id="stampDateInput">
    <button type="button" id="todayBtn">Today</button>
  </div>
  <div class="gallery-row" id="stampGallery"></div>
  <div class="action-row">
    <div class="pages-nav">
      <button class="icon-btn" id="prevPage" disabled>‹</button>
      <span id="pageIndicator">–</span>
      <button class="icon-btn" id="nextPage" disabled>›</button>
    </div>
    <button class="primary-btn" id="addStampBtn" disabled>+ Add Stamp</button>
    <button class="ghost-btn" id="autoStampSignBtn" disabled title="Auto Stamp &amp; Sign">✨</button>
    <button class="ghost-btn" id="downloadBtn" disabled>⬇︎</button>
  </div>
</div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="edit-sheet" id="editSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">
    <span>Adjust stamp</span>
    <button id="removeStampBtn">Remove</button>
  </div>
  <div class="field" id="sheetDateField" style="display:none;">
    <label><span>Date</span></label>
    <input type="date" id="sheetDateInput">
  </div>
  <div class="field" id="sheetSignField" style="display:none;">
    <label><span>Signature</span></label>
    <button type="button" id="autoSignBtn" class="autosign-btn">✍️ Auto Sign</button>
  </div>
  <div class="field">
    <label><span>Size</span><b id="sizeVal">100%</b></label>
    <input type="range" id="sizeRange" min="30" max="300" value="100">
  </div>
  <div class="field">
    <label><span>Rotation</span><b id="rotateVal">0°</b></label>
    <input type="range" id="rotateRange" min="-45" max="45" value="0">
  </div>
  <div class="field" style="margin-bottom:6px;">
    <label><span>Opacity</span><b id="opacityVal">85%</b></label>
    <input type="range" id="opacityRange" min="20" max="100" value="85">
  </div>
  <button class="sheet-done" id="sheetDoneBtn">Done</button>
</div>

<div class="toast" id="toast"></div>

</div><!-- /appRoot -->

<script>
(function(){
  // --- Access gate ---
  // Value is never stored in plain text: only a salted SHA-256 hash is kept here.
  var SALT = 'x7Qz1mPd9Ls_';
  var HASH = '16aa20cf2c28f686bba5f6ad014370aef16f2db8e12ab6d769cfd4780d9ea51c';
  var MAX_ATTEMPTS = 5;
  var BASE_LOCK_MS = 30000;
  var MAX_LOCK_MS = 30 * 60 * 1000;
  var STORE_KEY = '_hfx_g';

  var lockScreen = document.getElementById('lockScreen');
  var appRoot = document.getElementById('appRoot');
  var form = document.getElementById('lockForm');
  var input = document.getElementById('lockInput');
  var submitBtn = document.getElementById('lockSubmit');
  var lockMsg = document.getElementById('lockMsg');
  var tickTimer = null;

  function sha256Hex(str){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
    });
  }

  function getState(){
    try{ return JSON.parse(localStorage.getItem(STORE_KEY) || '{"c":0,"t":0}'); }
    catch(e){ return {c:0,t:0}; }
  }
  function setState(o){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(o)); }catch(e){}
  }

  function msLockedRemaining(){
    var s = getState();
    if(s.c < MAX_ATTEMPTS) return 0;
    var wait = Math.min(BASE_LOCK_MS * Math.pow(2, s.c - MAX_ATTEMPTS), MAX_LOCK_MS);
    var remaining = (s.t + wait) - Date.now();
    return remaining > 0 ? remaining : 0;
  }

  function refreshLockUI(){
    if(tickTimer){ clearTimeout(tickTimer); tickTimer = null; }
    var remaining = msLockedRemaining();
    if(remaining > 0){
      input.disabled = true; submitBtn.disabled = true;
      var mins = Math.floor(remaining/60000), secs = Math.ceil((remaining%60000)/1000);
      lockMsg.textContent = mins > 0 ? ('Try again in ' + mins + 'm ' + secs + 's') : ('Try again in ' + secs + 's');
      tickTimer = setTimeout(refreshLockUI, 1000);
    } else {
      input.disabled = false; submitBtn.disabled = false;
      lockMsg.textContent = '';
    }
  }

  function unlock(){
    try{ sessionStorage.setItem('_hfx_ok', '1'); }catch(e){}
    lockScreen.classList.add('hidden');
    appRoot.classList.remove('hidden');
  }

  try{
    if(sessionStorage.getItem('_hfx_ok') === '1'){
      unlock();
    }
  }catch(e){}

  refreshLockUI();

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(msLockedRemaining() > 0){ refreshLockUI(); return; }
    var val = input.value;
    submitBtn.disabled = true;
    sha256Hex(SALT + val).then(function(hex){
      if(hex === HASH){
        setState({c:0,t:0});
        unlock();
      } else {
        var s = getState();
        s.c = (s.c||0) + 1; s.t = Date.now();
        setState(s);
        input.value = '';
        submitBtn.disabled = false;
        refreshLockUI();
      }
    }).catch(function(){
      submitBtn.disabled = false;
    });
  });
})();
</script>

<script>
(function(){

if (typeof pdfjsLib === 'undefined' || typeof PDFLib === 'undefined') {
  document.body.innerHTML = '<div style="padding:32px 20px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;color:#444;line-height:1.6;">Could not load required components.<br>Please check your internet connection and reload the page.</div>';
  return;
}

const PDFJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js';

// ---- Date helpers ----
const MONTHS3 = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function todayISO(){
  const d = new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function formatStampDateText(iso){
  const parts = (iso || todayISO()).split('-').map(Number);
  const y = parts[0], m = parts[1], d = parts[2];
  if(!y || !m || !d) return formatStampDateText(todayISO());
  return String(d).padStart(2,'0') + ' ' + MONTHS3[m-1] + ' ' + y;
}

// ---- Dynamic date compositing ----
const templateImgCache = {};
function loadTemplateImg(stampId){
  if(templateImgCache[stampId]) return templateImgCache[stampId];
  const def = getStamp(stampId);
  const p = new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = ()=>reject(new Error('Failed to load stamp image'));
    img.src = def.src;
  });
  templateImgCache[stampId] = p;
  return p;
}

const composedCache = {};
async function getStampSrc(stampId, dateStr, signed){
  const def = getStamp(stampId);
  const needsSign = !!(signed && def.signBox);
  if(!def.hasDate && !needsSign) return def.src;
  const iso = dateStr || state.stampDate || todayISO();
  const key = stampId+'|'+(def.hasDate?iso:'')+'|'+(needsSign?'sig':'');
  if(composedCache[key]) return composedCache[key];
  let dataUrl;
  try{
    const img = await loadTemplateImg(stampId);
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    if(def.hasDate){
      const box = def.dateBox;
      const bx = box.x*canvas.width, by = box.y*canvas.height, bw = box.w*canvas.width, bh = box.h*canvas.height;
      const text = formatStampDateText(iso);
      let fontSize = bh*0.86;
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(35,52,175,0.86)';
      const measure = (fs)=>{
        ctx.font = '700 '+fs+'px Arial, "Helvetica Neue", Helvetica, sans-serif';
        const spacing = fs*0.16;
        let total = 0;
        const widths = [];
        const chars = Array.from(text);
        for(const ch of chars){
          const w = ctx.measureText(ch).width;
          widths.push(w);
          total += w + spacing;
        }
        total -= spacing;
        return { spacing, widths, total, chars };
      };
      let m = measure(fontSize);
      if(m.total > bw*0.9){
        fontSize *= (bw*0.9)/m.total;
        m = measure(fontSize);
      }
      let x = bx + (bw-m.total)/2;
      const y = by + bh/2 + fontSize*0.03;
      for(let i=0;i<m.chars.length;i++){
        ctx.fillText(m.chars[i], x, y);
        x += m.widths[i] + m.spacing;
      }
    }
    if(needsSign){
      const sigImg = await loadTemplateImg('signature');
      const box = def.signBox;
      const bx = box.x*canvas.width, by = box.y*canvas.height, bw = box.w*canvas.width, bh = box.h*canvas.height;
      ctx.drawImage(sigImg, bx, by, bw, bh);
    }
    dataUrl = canvas.toDataURL('image/png');
  }catch(err){
    console.error('Stamp compose failed', err);
    dataUrl = def.src;
  }
  composedCache[key] = dataUrl;
  return dataUrl;
}

// ---- Gallery ----
function renderGallery(){
  el.stampGallery.innerHTML = '';
  STAMPS.forEach(t=>{
    const thumb = document.createElement('div');
    thumb.className = 'stamp-thumb' + (t.id===state.activeStampId ? ' active':'');
    thumb.title = t.name;
    const img = document.createElement('img');
    img.alt = t.name;
    img.src = t.src;
    thumb.appendChild(img);
    thumb.addEventListener('click', ()=>{
      state.activeStampId = t.id;
      renderGallery();
    });
    el.stampGallery.appendChild(thumb);
    if(t.hasDate){
      getStampSrc(t.id, state.stampDate).then(src=>{ img.src = src; }).catch(()=>{});
    }
  });
  const activeDef = getStamp(state.activeStampId);
  if(activeDef.hasDate){
    el.dateRow.style.display = 'flex';
    el.stampDateInput.value = state.stampDate;
  } else {
    el.dateRow.style.display = 'none';
  }
}
renderGallery();

el.stampDateInput.addEventListener('change', ()=>{
  if(el.stampDateInput.value){ state.stampDate = el.stampDateInput.value; }
  renderGallery();
});
el.todayBtn.addEventListener('click', ()=>{
  state.stampDate = todayISO();
  el.stampDateInput.value = state.stampDate;
  renderGallery();
});

// ---- File loading ----
el.pdfInput.addEventListener('change', async (e)=>{
  const file = e.target.files && e.target.files[0];
  e.target.value = ''; // allow re-picking the same file, and avoids a stuck input on iOS
  if(!file) return;
  hideBanner();
  if(file.size > 60*1024*1024){
    showBanner('This PDF is '+(file.size/1024/1024).toFixed(1)+' MB - quite large for a phone browser. It may take a while or fail to open.');
  }
  el.statusText.textContent = 'Reading file…';
  let buf;
  try{
    buf = await file.arrayBuffer();
  }catch(err1){
    try{
      buf = await new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = ()=>resolve(reader.result);
        reader.onerror = ()=>reject(reader.error || new Error('FileReader failed'));
        reader.readAsArrayBuffer(file);
      });
    }catch(err2){
      console.error(err1, err2);
      el.statusText.textContent = 'Could not read that file';
      showBanner("Couldn't read the file from your device. Please try again, or pick a different PDF.");
      return;
    }
  }
  state.pdfBytes = buf;
  state.fileBaseName = file.name.replace(/\.[^/.]+$/, '') || 'document';
  await loadPdf(buf.slice(0));
});

async function loadPdf(buf){
  el.statusText.textContent = 'Loading…';
  try{
    const loadingTask = pdfjsLib.getDocument({
      data: buf,
      cMapUrl: PDFJS_BASE + 'cmaps/',
      cMapPacked: true,
      standardFontDataUrl: PDFJS_BASE + 'standard_fonts/',
    });
    state.pdfDoc = await loadingTask.promise;
    state.numPages = state.pdfDoc.numPages;
    state.currentPage = 1;
    state.stampsByPage = {};
    el.emptyState.style.display = 'none';
    el.addStampBtn.disabled = false;
    el.autoStampSignBtn.disabled = false;
    el.downloadBtn.disabled = false;
    el.prevPage.disabled = false;
    el.nextPage.disabled = false;
    state.hintShown = false;
    await renderPage(state.currentPage);
    el.statusText.textContent = state.numPages + ' page' + (state.numPages>1?'s':'') + ' loaded';
  }catch(err){
    console.error(err);
    el.statusText.textContent = 'Could not open that PDF';
    showToast('Could not read this PDF: ' + (err && err.message ? err.message : 'unknown error'));
    showBanner("Couldn't open this PDF. It may be corrupted, password-protected, or too large for this device's memory. " + (err && err.message ? err.message : ''));
  }
}

let currentStage = null;
let zoomSizerEl = null;
let drawOverlayEl = null;
const pinch = { pointers: new Map(), startDist:0, startZoom:1, panStart:null };

function distanceBetween(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

function applyZoom(){
  if(!zoomSizerEl || !currentStage) return;
  const pw = parseFloat(currentStage.dataset.pageWidth);
  const ph = parseFloat(currentStage.dataset.pageHeight);
  zoomSizerEl.style.width = (pw*state.zoom)+'px';
  zoomSizerEl.style.height = (ph*state.zoom)+'px';
  currentStage.style.transform = 'scale('+state.zoom+')';
}

function wirePinchAndPan(container){
  pinch.pointers.clear();
  pinch.startDist = 0;
  pinch.panStart = null;

  container.addEventListener('pointerdown', (e)=>{
    if(e.target.closest && e.target.closest('.stamp-el')) return;
    try{ container.setPointerCapture(e.pointerId); }catch(err){}
    pinch.pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pinch.pointers.size===2){
      const pts = Array.from(pinch.pointers.values());
      pinch.startDist = distanceBetween(pts[0], pts[1]);
      pinch.startZoom = state.zoom;
      pinch.panStart = null;
    } else if(pinch.pointers.size===1){
      pinch.panStart = { x:e.clientX, y:e.clientY, left: el.viewerWrap.scrollLeft, top: el.viewerWrap.scrollTop };
    }
  });
  container.addEventListener('pointermove', (e)=>{
    if(!pinch.pointers.has(e.pointerId)) return;
    pinch.pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const pts = Array.from(pinch.pointers.values());
    if(pts.length===2){
      e.preventDefault();
      const dist = distanceBetween(pts[0], pts[1]);
      if(pinch.startDist>0){
        let z = pinch.startZoom*(dist/pinch.startDist);
        z = Math.max(1, Math.min(4, z));
        state.zoom = z;
        applyZoom();
      }
    } else if(pts.length===1 && pinch.panStart){
      e.preventDefault();
      el.viewerWrap.scrollLeft = pinch.panStart.left - (pts[0].x-pinch.panStart.x);
      el.viewerWrap.scrollTop = pinch.panStart.top - (pts[0].y-pinch.panStart.y);
    }
  }, {passive:false});
  const release = (e)=>{
    pinch.pointers.delete(e.pointerId);
    if(pinch.pointers.size<2) pinch.startDist=0;
    if(pinch.pointers.size===0) pinch.panStart=null;
  };
  container.addEventListener('pointerup', release);
  container.addEventListener('pointercancel', release);
}

// ---- Auto Stamp & Sign (freehand draw an area, AI-style fill + auto sign) ----
function enterDrawMode(){
  if(!currentStage){ showToast('Open a PDF first'); return; }
  if(state.drawMode) return;
  deselectAll();
  state.drawMode = true;
  el.autoStampSignBtn.classList.add('active');
  showToast('Draw an area to auto stamp & sign');
  attachDrawOverlay(currentStage);
}
function exitDrawMode(){
  state.drawMode = false;
  if(el.autoStampSignBtn) el.autoStampSignBtn.classList.remove('active');
  removeDrawOverlay();
}
function removeDrawOverlay(){
  if(drawOverlayEl){ drawOverlayEl.remove(); drawOverlayEl = null; }
}

function attachDrawOverlay(stage){
  removeDrawOverlay();
  const pw = parseFloat(stage.dataset.pageWidth);
  const ph = parseFloat(stage.dataset.pageHeight);
  const canvas = document.createElement('canvas');
  canvas.className = 'draw-overlay';
  canvas.width = Math.max(1, Math.round(pw));
  canvas.height = Math.max(1, Math.round(ph));
  stage.appendChild(canvas);
  drawOverlayEl = canvas;
  const ctx = canvas.getContext('2d');

  let drawing = false, pts = [];
  function toLocal(e){
    const rect = stage.getBoundingClientRect();
    return { x:(e.clientX-rect.left)/state.zoom, y:(e.clientY-rect.top)/state.zoom };
  }
  function redraw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(pts.length<2) return;
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.lineWidth = Math.max(2, pw*0.006);
    ctx.strokeStyle = 'rgba(91,124,255,0.95)';
    ctx.shadowColor = 'rgba(91,124,255,0.85)';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }
  canvas.addEventListener('pointerdown', (e)=>{
    e.preventDefault(); e.stopPropagation();
    drawing = true; pts = [toLocal(e)];
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    redraw();
  });
  canvas.addEventListener('pointermove', (e)=>{
    if(!drawing) return;
    e.preventDefault(); e.stopPropagation();
    pts.push(toLocal(e));
    redraw();
  }, {passive:false});
  canvas.addEventListener('pointerup', (e)=>{
    if(!drawing) return;
    e.stopPropagation();
    drawing = false;
    const finalPts = pts.slice();
    pts = [];
    finishDraw(stage, finalPts);
  });
  canvas.addEventListener('pointercancel', (e)=>{ e.stopPropagation(); drawing=false; pts=[]; redraw(); });
}

async function finishDraw(stage, pts){
  exitDrawMode();
  if(pts.length<2) return;
  const pw = parseFloat(stage.dataset.pageWidth);
  const ph = parseFloat(stage.dataset.pageHeight);

  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const p of pts){
    if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
    if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
  }
  minX = Math.max(0, minX); minY = Math.max(0, minY);
  maxX = Math.min(pw, maxX); maxY = Math.min(ph, maxY);
  const bw = maxX-minX, bh = maxY-minY;
  if(bw < pw*0.04 || bh < ph*0.02){
    showToast('Draw a bigger area for auto stamp & sign');
    return;
  }

  const overlay = document.createElement('div');
  overlay.className = 'glitter-overlay';
  overlay.style.left = minX+'px';
  overlay.style.top = minY+'px';
  overlay.style.width = bw+'px';
  overlay.style.height = bh+'px';
  for(let i=0;i<9;i++){
    const sp = document.createElement('span');
    sp.className = 'sparkle';
    sp.textContent = '✨';
    sp.style.left = (6+Math.random()*88)+'%';
    sp.style.top = (6+Math.random()*88)+'%';
    sp.style.animationDelay = (Math.random()*1.1).toFixed(2)+'s';
    sp.style.fontSize = (12+Math.random()*10)+'px';
    overlay.appendChild(sp);
  }
  const pctEl = document.createElement('div');
  pctEl.className = 'glitter-pct';
  pctEl.textContent = '0%';
  overlay.appendChild(pctEl);
  stage.appendChild(overlay);

  const DURATION = 4000;
  const start = performance.now();
  await new Promise(resolve=>{
    function tick(now){
      const elapsed = now-start;
      const pct = Math.min(100, Math.floor((elapsed/DURATION)*100));
      pctEl.textContent = pct+'%';
      if(elapsed < DURATION){
        requestAnimationFrame(tick);
      } else {
        pctEl.textContent = '100%';
        resolve();
      }
    }
    requestAnimationFrame(tick);
  });
  overlay.remove();

  const def = getStamp('blank');
  let placeW = bw, placeH = bw*def.aspect;
  if(placeH > bh){ placeH = bh; placeW = bh/def.aspect; }
  const placeX = minX + (bw-placeW)/2;
  const placeY = minY + (bh-placeH)/2;
  const s = {
    id: 's'+Math.random().toString(36).slice(2,9),
    stampId: 'blank',
    xRatio: placeX/pw, yRatio: placeY/ph,
    wRatio: placeW/pw, hRatio: placeH/ph,
    baseWRatio: placeW/pw, baseHRatio: placeH/ph,
    opacity: 0.85, rotation: 0,
    signed: true,
  };
  if(!state.stampsByPage[state.currentPage]) state.stampsByPage[state.currentPage] = [];
  state.stampsByPage[state.currentPage].push(s);
  await attachStampEl(stage, s);
  showToast('Stamped & signed!');
}

el.autoStampSignBtn.addEventListener('click', ()=>{
  if(state.drawMode){ exitDrawMode(); } else { enterDrawMode(); }
});

async function renderPage(pageNum){
  exitDrawMode();
  const page = await state.pdfDoc.getPage(pageNum);

  const unscaled = page.getViewport({scale:1});
  const available = Math.max(200, el.viewerWrap.clientWidth - 20);
  const scale = available / unscaled.width;
  const viewport = page.getViewport({scale});

  let renderScale = Math.min(window.devicePixelRatio || 1, 2);
  const MAX_PIXELS = 4000000;
  if(viewport.width*renderScale * (viewport.height*renderScale) > MAX_PIXELS){
    renderScale = Math.max(1, Math.sqrt(MAX_PIXELS/(viewport.width*viewport.height)));
  }

  el.viewerWrap.innerHTML = '';
  state.zoom = 1;

  const zoomSizer = document.createElement('div');
  zoomSizer.className = 'zoom-sizer';
  zoomSizer.style.width = viewport.width+'px';
  zoomSizer.style.height = viewport.height+'px';

  const stage = document.createElement('div');
  stage.className = 'page-stage';
  stage.style.width = viewport.width+'px';
  stage.style.height = viewport.height+'px';
  stage.style.transformOrigin = '0 0';

  const canvas = document.createElement('canvas');
  canvas.width = Math.floor(viewport.width*renderScale);
  canvas.height = Math.floor(viewport.height*renderScale);
  canvas.style.width = viewport.width+'px';
  canvas.style.height = viewport.height+'px';
  stage.appendChild(canvas);
  zoomSizer.appendChild(stage);

  const hint = document.createElement('div');
  hint.className = 'zoom-hint';
  hint.textContent = 'Pinch to zoom';
  zoomSizer.appendChild(hint);

  el.viewerWrap.appendChild(zoomSizer);
  currentStage = stage;
  zoomSizerEl = zoomSizer;

  const ctx = canvas.getContext('2d');
  const transform = renderScale!==1 ? [renderScale,0,0,renderScale,0,0] : undefined;
  try{
    await page.render({canvasContext: ctx, viewport, transform}).promise;
  }catch(renderErr){
    console.error(renderErr);
    showBanner("This page couldn't be fully rendered (it may be very complex, or your device is low on memory).");
  }

  stage.dataset.pageWidth = viewport.width;
  stage.dataset.pageHeight = viewport.height;

  const stamps = state.stampsByPage[pageNum] || [];
  for(const s of stamps){ await attachStampEl(stage, s); }

  el.pageIndicator.textContent = pageNum + ' / ' + state.numPages;
  deselectAll();
  wirePinchAndPan(zoomSizer);

  if(!state.hintShown){
    state.hintShown = true;
    requestAnimationFrame(()=>{
      hint.classList.add('show');
      setTimeout(()=>hint.classList.remove('show'), 2200);
    });
  }
}

let resizeTimer=null;
window.addEventListener('resize', ()=>{
  if(!state.pdfDoc) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>renderPage(state.currentPage), 200);
});

el.prevPage.addEventListener('click', async ()=>{
  if(state.currentPage>1){ state.currentPage--; await renderPage(state.currentPage); }
});
el.nextPage.addEventListener('click', async ()=>{
  if(state.currentPage<state.numPages){ state.currentPage++; await renderPage(state.currentPage); }
});

function makeStampObj(stage){
  const pw = parseFloat(stage.dataset.pageWidth);
  const ph = parseFloat(stage.dataset.pageHeight);
  const def = getStamp(state.activeStampId);
  const w = Math.min(pw*0.45, 220);
  const h = w*def.aspect;
  const obj = {
    id: 's'+Math.random().toString(36).slice(2,9),
    stampId: def.id,
    xRatio: 0.5 - (w/2)/pw,
    yRatio: 0.5 - (h/2)/ph,
    wRatio: w/pw, hRatio: h/ph,
    baseWRatio: w/pw, baseHRatio: h/ph,
    opacity: 0.85, rotation: 0,
  };
  if(def.hasDate){ obj.dateStr = state.stampDate || todayISO(); }
  if(def.signBox){ obj.signed = false; }
  return obj;
}

el.addStampBtn.addEventListener('click', async ()=>{
  if(!currentStage) return;
  exitDrawMode();
  const s = makeStampObj(currentStage);
  if(!state.stampsByPage[state.currentPage]) state.stampsByPage[state.currentPage] = [];
  state.stampsByPage[state.currentPage].push(s);
  await attachStampEl(currentStage, s);
  setSelection(s.id);
  openSheet();
});

async function attachStampEl(stage, s){
  const pw = parseFloat(stage.dataset.pageWidth);
  const ph = parseFloat(stage.dataset.pageHeight);

  const wrap = document.createElement('div');
  wrap.className = 'stamp-el';
  wrap.dataset.id = s.id;
  wrap.style.left = (s.xRatio*pw)+'px';
  wrap.style.top = (s.yRatio*ph)+'px';
  wrap.style.width = (s.wRatio*pw)+'px';
  wrap.style.height = (s.hRatio*ph)+'px';
  wrap.style.opacity = s.opacity;
  wrap.style.transform = 'rotate('+s.rotation+'deg)';

  const def = getStamp(s.stampId);
  const img = document.createElement('img');
  img.alt = def.name;
  img.src = def.src;
  wrap.appendChild(img);
  if(def.hasDate || s.signed){
    getStampSrc(s.stampId, s.dateStr, s.signed).then(src=>{ img.src = src; }).catch(()=>{});
  }

  const del = document.createElement('div');
  del.className = 'del';
  del.innerHTML = '<div class="x">×</div>';
  del.addEventListener('pointerdown', (e)=> e.stopPropagation());
  del.addEventListener('click', (e)=>{
    e.stopPropagation();
    removeStamp(s.id, wrap);
  });
  wrap.appendChild(del);

  function makeHit(cls){
    const hit = document.createElement('div');
    hit.className = 'hit '+cls;
    hit.innerHTML = '<div class="dot"></div>';
    wrap.appendChild(hit);
    return hit;
  }
  const hitE = makeHit('hit-e'), hitW = makeHit('hit-w'), hitN = makeHit('hit-n'), hitS = makeHit('hit-s');

  stage.appendChild(wrap);

  let dragging=false, moved=false, startX=0, startY=0, startLeft=0, startTop=0;
  let longPressTimer=null, justActivated=false;
  const LONG_PRESS_MS = 450;
  const LONG_PRESS_MOVE_TOLERANCE = 8;

  wrap.addEventListener('pointerdown', (e)=>{
    if(e.target.closest('.hit') || e.target.closest('.del')) return;
    moved=false; justActivated=false;
    startX=e.clientX; startY=e.clientY;
    startLeft=parseFloat(wrap.style.left); startTop=parseFloat(wrap.style.top);
    wrap.setPointerCapture(e.pointerId);

    const isActive = state.selectedStamp === s.id;
    if(isActive){
      // Already active: drag starts immediately.
      dragging = true;
    } else {
      // Locked: only a long-press reactivates it. A short tap or a drag
      // gesture on a locked stamp does nothing.
      dragging = false;
      longPressTimer = setTimeout(()=>{
        longPressTimer = null;
        justActivated = true;
        setSelection(s.id);
        // Seamlessly allow dragging to continue from here if the
        // pointer is still down and moves after activation.
        dragging = true;
        moved = false;
      }, LONG_PRESS_MS);
    }
  });
  wrap.addEventListener('pointermove', (e)=>{
    const dx=e.clientX-startX, dy=e.clientY-startY;
    if(!dragging){
      // Cancel a pending long-press if the pointer moves too much
      // (treat as an accidental drag/scroll on a locked stamp).
      if(longPressTimer && (Math.abs(dx)>LONG_PRESS_MOVE_TOLERANCE || Math.abs(dy)>LONG_PRESS_MOVE_TOLERANCE)){
        clearTimeout(longPressTimer); longPressTimer=null;
      }
      return;
    }
    if(!moved){
      if(Math.abs(dx)>4 || Math.abs(dy)>4){ moved=true; closeSheet(); }
    }
    let nl = startLeft + dx/state.zoom;
    let nt = startTop + dy/state.zoom;
    nl = Math.max(-wrap.offsetWidth*0.5, Math.min(pw-wrap.offsetWidth*0.5, nl));
    nt = Math.max(-wrap.offsetHeight*0.5, Math.min(ph-wrap.offsetHeight*0.5, nt));
    wrap.style.left = nl+'px'; wrap.style.top = nt+'px';
    s.xRatio = nl/pw; s.yRatio = nt/ph;
  });
  wrap.addEventListener('pointerup', (e)=>{
    if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; }
    const wasActiveBeforeThisPress = state.selectedStamp===s.id && !justActivated;
    if(dragging && !moved && wasActiveBeforeThisPress){
      // A plain tap on a stamp that was already active opens its editor.
      setSelection(s.id);
      openSheet();
    }
    dragging=false; moved=false; justActivated=false;
  });
  wrap.addEventListener('pointercancel', ()=>{
    if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; }
    dragging=false; moved=false; justActivated=false;
  });

  function setupStretch(hitEl, axis, fromStart){
    let active=false, moved=false, startX=0, startY=0, startW=0, startH=0, startLeft=0, startTop=0;
    hitEl.addEventListener('pointerdown', (e)=>{
      e.stopPropagation();
      active=true; moved=false;
      hitEl.setPointerCapture(e.pointerId);
      startX=e.clientX; startY=e.clientY;
      startW=parseFloat(wrap.style.width); startH=parseFloat(wrap.style.height);
      startLeft=parseFloat(wrap.style.left); startTop=parseFloat(wrap.style.top);
      setSelection(s.id);
    });
    hitEl.addEventListener('pointermove', (e)=>{
      if(!active) return;
      if(!moved){
        const dx=e.clientX-startX, dy=e.clientY-startY;
        if(Math.abs(dx)>4 || Math.abs(dy)>4){ moved=true; closeSheet(); }
      }
      if(axis==='x'){
        const delta = (e.clientX-startX)/state.zoom;
        if(fromStart==='right'){
          const nw = Math.max(24, startW+delta);
          wrap.style.width = nw+'px'; s.wRatio = nw/pw;
        } else {
          const nw = Math.max(24, startW-delta);
          const nl = startLeft + (startW-nw);
          wrap.style.width = nw+'px'; wrap.style.left = nl+'px';
          s.wRatio = nw/pw; s.xRatio = nl/pw;
        }
      } else {
        const delta = (e.clientY-startY)/state.zoom;
        if(fromStart==='bottom'){
          const nh = Math.max(24, startH+delta);
          wrap.style.height = nh+'px'; s.hRatio = nh/ph;
        } else {
          const nh = Math.max(24, startH-delta);
          const nt = startTop + (startH-nh);
          wrap.style.height = nh+'px'; wrap.style.top = nt+'px';
          s.hRatio = nh/ph; s.yRatio = nt/ph;
        }
      }
    });
    hitEl.addEventListener('pointerup', (e)=>{ e.stopPropagation(); active=false; });
  }
  setupStretch(hitE,'x','right'); setupStretch(hitW,'x','left');
  setupStretch(hitS,'y','bottom'); setupStretch(hitN,'y','top');
}

function removeStamp(id, wrapEl){
  const arr = state.stampsByPage[state.currentPage] || [];
  state.stampsByPage[state.currentPage] = arr.filter(x=>x.id!==id);
  if(wrapEl) wrapEl.remove();
  if(state.selectedStamp===id) deselectAll();
}

function findStamp(id){
  const arr = state.stampsByPage[state.currentPage] || [];
  return arr.find(x=>x.id===id);
}

function setSelection(id){
  state.selectedStamp = id;
  document.querySelectorAll('.stamp-el').forEach(w=>{
    w.classList.toggle('selected', w.dataset.id===id);
  });
  if(id){
    const s = findStamp(id);
    if(s){
      el.sizeRange.value = Math.round((s.wRatio/s.baseWRatio)*100);
      el.sizeVal.textContent = el.sizeRange.value+'%';
      el.rotateRange.value = s.rotation;
      el.rotateVal.textContent = s.rotation+'°';
      el.opacityRange.value = Math.round(s.opacity*100);
      el.opacityVal.textContent = el.opacityRange.value+'%';
      const def = getStamp(s.stampId);
      if(def.hasDate){
        el.sheetDateField.style.display = 'block';
        el.sheetDateInput.value = s.dateStr || state.stampDate;
      } else {
        el.sheetDateField.style.display = 'none';
      }
      if(def.signBox){
        el.sheetSignField.style.display = 'block';
        updateAutoSignBtn(s);
      } else {
        el.sheetSignField.style.display = 'none';
      }
    }
  }
}
function updateAutoSignBtn(s){
  if(!el.autoSignBtn) return;
  if(s.signed){
    el.autoSignBtn.textContent = '✓ Signed — Remove';
    el.autoSignBtn.classList.add('is-signed');
  } else {
    el.autoSignBtn.textContent = '✍️ Auto Sign';
    el.autoSignBtn.classList.remove('is-signed');
  }
}
function openSheet(){
  if(!state.selectedStamp) return;
  el.editSheet.classList.add('open');
  el.sheetBackdrop.classList.add('open');
}
function closeSheet(){
  el.editSheet.classList.remove('open');
  el.sheetBackdrop.classList.remove('open');
}
function deselectAll(){
  closeSheet();
  setSelection(null);
}

el.sheetDateInput.addEventListener('change', async ()=>{
  const s = findStamp(state.selectedStamp);
  if(!s || !el.sheetDateInput.value) return;
  s.dateStr = el.sheetDateInput.value;
  const wrapEl = document.querySelector('.stamp-el[data-id="'+s.id+'"]');
  if(wrapEl){
    const img = wrapEl.querySelector('img');
    if(img){ img.src = await getStampSrc(s.stampId, s.dateStr, s.signed); }
  }
});

el.autoSignBtn.addEventListener('click', async ()=>{
  const s = findStamp(state.selectedStamp);
  if(!s) return;
  const def = getStamp(s.stampId);
  if(!def.signBox) return;
  s.signed = !s.signed;
  updateAutoSignBtn(s);
  const wrapEl = document.querySelector('.stamp-el[data-id="'+s.id+'"]');
  if(wrapEl){
    const img = wrapEl.querySelector('img');
    if(img){ img.src = await getStampSrc(s.stampId, s.dateStr, s.signed); }
  }
  showToast(s.signed ? 'Signature added' : 'Signature removed');
});

el.sizeRange.addEventListener('input', ()=>{
  const s = findStamp(state.selectedStamp);
  if(!s || !currentStage) return;
  const pw = parseFloat(currentStage.dataset.pageWidth);
  const ph = parseFloat(currentStage.dataset.pageHeight);
  const cxRatio = s.xRatio + s.wRatio/2, cyRatio = s.yRatio + s.hRatio/2;
  const pct = parseInt(el.sizeRange.value,10);
  el.sizeVal.textContent = pct+'%';
  const newW = s.baseWRatio*(pct/100), newH = s.baseHRatio*(pct/100);
  s.wRatio=newW; s.hRatio=newH; s.xRatio=cxRatio-newW/2; s.yRatio=cyRatio-newH/2;
  const w = document.querySelector('.stamp-el[data-id="'+s.id+'"]');
  if(w){
    w.style.width=(newW*pw)+'px'; w.style.height=(newH*ph)+'px';
    w.style.left=(s.xRatio*pw)+'px'; w.style.top=(s.yRatio*ph)+'px';
  }
});
el.rotateRange.addEventListener('input', ()=>{
  const s = findStamp(state.selectedStamp);
  if(!s) return;
  s.rotation = parseInt(el.rotateRange.value,10);
  el.rotateVal.textContent = s.rotation+'°';
  const w = document.querySelector('.stamp-el[data-id="'+s.id+'"]');
  if(w) w.style.transform = 'rotate('+s.rotation+'deg)';
});
el.opacityRange.addEventListener('input', ()=>{
  const s = findStamp(state.selectedStamp);
  if(!s) return;
  s.opacity = el.opacityRange.value/100;
  el.opacityVal.textContent = el.opacityRange.value+'%';
  const w = document.querySelector('.stamp-el[data-id="'+s.id+'"]');
  if(w) w.style.opacity = s.opacity;
});

el.removeStampBtn.addEventListener('click', ()=>{
  if(!state.selectedStamp) return;
  const wrapEl = document.querySelector('.stamp-el[data-id="'+state.selectedStamp+'"]');
  removeStamp(state.selectedStamp, wrapEl);
});
el.sheetDoneBtn.addEventListener('click', ()=> deselectAll());
el.sheetBackdrop.addEventListener('click', ()=> deselectAll());
el.viewerWrap.addEventListener('click', (e)=>{ if(e.target===el.viewerWrap) deselectAll(); });

function computeUsageFlags(){
  let hasStamp = false, hasSignature = false;
  for(const arr of Object.values(state.stampsByPage)){
    for(const s of arr){
      if(s.stampId === 'signature'){
        hasSignature = true;
      } else {
        hasStamp = true;
        if(s.signed) hasSignature = true;
      }
    }
  }
  return { hasStamp, hasSignature };
}
function buildOutputFilename(){
  const base = state.fileBaseName || 'document';
  const { hasStamp, hasSignature } = computeUsageFlags();
  let suffix = '';
  if(hasStamp && hasSignature) suffix = ' Stamped and Signed';
  else if(hasStamp) suffix = ' Stamped';
  else if(hasSignature) suffix = ' Signed';
  return base + suffix + '.pdf';
}

el.downloadBtn.addEventListener('click', async ()=>{
  const total = Object.values(state.stampsByPage).reduce((a,arr)=>a+arr.length,0);
  if(total===0){ showToast('Place a stamp first.'); return; }
  el.downloadBtn.disabled = true;
  const prevText = el.downloadBtn.textContent;
  el.downloadBtn.textContent = '…';
  try{
    const { PDFDocument, degrees } = PDFLib;
    const srcDoc = await PDFDocument.load(state.pdfBytes.slice(0), { ignoreEncryption: true, updateMetadata: false });

    const embeddedCache = {};
    async function getEmbedded(stampId, dateStr, signed){
      const key = stampId+'|'+(dateStr||'')+'|'+(signed?'sig':'');
      if(embeddedCache[key]) return embeddedCache[key];
      const src = await getStampSrc(stampId, dateStr, signed);
      const b64 = src.split(',')[1];
      const bytes = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
      const embedded = await srcDoc.embedPng(bytes);
      embeddedCache[key] = embedded;
      return embedded;
    }

    const pages = srcDoc.getPages();
    for(const [pageNumStr, stamps] of Object.entries(state.stampsByPage)){
      const pageNum = parseInt(pageNumStr,10);
      const page = pages[pageNum-1];
      if(!page) continue;
      const { width: pw, height: ph } = page.getSize();

      for(const s of stamps){
        const stampImage = await getEmbedded(s.stampId, s.dateStr, s.signed);
        const w = s.wRatio*pw, h = s.hRatio*ph;
        const xTop = s.xRatio*pw, yTop = s.yRatio*ph;

        if(s.rotation===0){
          page.drawImage(stampImage, { x:xTop, y: ph-yTop-h, width:w, height:h, opacity:s.opacity });
        } else {
          const cx = xTop + w/2, cyPdf = ph - yTop - h/2;
          const rad = s.rotation*Math.PI/180;
          const bl_x = cx - (w/2)*Math.cos(rad) - (h/2)*Math.sin(rad);
          const bl_y = cyPdf + (w/2)*Math.sin(rad) - (h/2)*Math.cos(rad);
          page.drawImage(stampImage, {
            x:bl_x, y:bl_y, width:w, height:h, opacity:s.opacity, rotate: degrees(-s.rotation),
          });
        }
      }
    }

    const outBytes = await srcDoc.save({ useObjectStreams: false });
    const blob = new Blob([outBytes], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    try{
      const a = document.createElement('a');
      a.href = url; a.download = buildOutputFilename();
      document.body.appendChild(a); a.click(); a.remove();
    }catch(dlErr){
      console.error(dlErr);
      window.open(url, '_blank');
    }
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
    showToast('Stamped PDF downloaded.');
  }catch(err){
    console.error(err);
    showToast('Something went wrong.');
    showBanner('Could not create the stamped PDF: ' + (err && err.message ? err.message : 'unknown error'));
  }finally{
    el.downloadBtn.disabled = false;
    el.downloadBtn.textContent = prevText;
  }
});

})();
</script>
